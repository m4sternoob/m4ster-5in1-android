name: Build APK

# Builds both debug APK flavors on every push to main (and on manual dispatch):
#   - withHints: full game, Number Guessing ships the cryptic Hint button
#   - noHints:   same game, pure guessing with no hints
# Debug APKs are signed with the SDK's debug key and install directly
# on a Pixel — no keystore or secrets needed. The workflow assumes this
# project's files live at the repository root.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs (both flavors)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 5in1-apks
          path: app/build/outputs/apk/*/debug/*.apk
